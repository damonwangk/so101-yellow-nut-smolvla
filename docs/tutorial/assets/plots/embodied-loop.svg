<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310"><title>具身智能的观察—动作—环境闭环</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#285c4a"/></marker></defs><rect width="1080" height="310" fill="#f7f5ee"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#242923"><text x="35" y="45" font-size="22" font-weight="600">具身智能的观察—动作—环境闭环</text><rect x="94.0" y="90" width="190" height="105" rx="5" fill="#eef1e7" stroke="#a8b79d"/><text x="189.0" y="123" text-anchor="middle" font-size="18" font-weight="600">环境</text><text x="189.0" y="153" text-anchor="middle" font-size="13">螺母、托盘、接触</text><text x="189.0" y="177" text-anchor="middle" font-size="13">物理状态改变</text><path d="M284.0 142 H324.0" fill="none" stroke="#285c4a" stroke-width="2" marker-end="url(#a)"/><rect x="328.0" y="90" width="190" height="105" rx="5" fill="#eef1e7" stroke="#a8b79d"/><text x="423.0" y="123" text-anchor="middle" font-size="18" font-weight="600">观察</text><text x="423.0" y="153" text-anchor="middle" font-size="13">腕部RGB与关节反馈</text><text x="423.0" y="177" text-anchor="middle" font-size="13">形成当前输入</text><path d="M518.0 142 H558.0" fill="none" stroke="#285c4a" stroke-width="2" marker-end="url(#a)"/><rect x="562.0" y="90" width="190" height="105" rx="5" fill="#eef1e7" stroke="#a8b79d"/><text x="657.0" y="123" text-anchor="middle" font-size="18" font-weight="600">策略</text><text x="657.0" y="153" text-anchor="middle" font-size="13">SmolVLA预测动作块</text><text x="657.0" y="177" text-anchor="middle" font-size="13">参数在执行时固定</text><path d="M752.0 142 H792.0" fill="none" stroke="#285c4a" stroke-width="2" marker-end="url(#a)"/><rect x="796.0" y="90" width="190" height="105" rx="5" fill="#eef1e7" stroke="#a8b79d"/><text x="891.0" y="123" text-anchor="middle" font-size="18" font-weight="600">执行器</text><text x="891.0" y="153" text-anchor="middle" font-size="13">队列、限幅、关节目标</text><text x="891.0" y="177" text-anchor="middle" font-size="13">改变下一次观察</text><path d="M891.0 195 V233 H189.0 V198" fill="none" stroke="#285c4a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="540" y="273" text-anchor="middle" font-size="14">结构示意：离线示范用于学习；在线新观察再次进入策略。箭头长度不表示实测耗时。</text></g></svg>