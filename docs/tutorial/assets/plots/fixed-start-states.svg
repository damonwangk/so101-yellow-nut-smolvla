<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310"><title>固定起点与两次Enter：准备阶段状态示意</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#285c4a"/></marker></defs><rect width="1080" height="310" fill="#f7f5ee"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#242923"><text x="35" y="45" font-size="22" font-weight="600">固定起点与两次Enter：准备阶段状态示意</text><rect x="30.0" y="90" width="150" height="105" rx="5" fill="#eef1e7" stroke="#a8b79d"/><text x="105.0" y="123" text-anchor="middle" font-size="18" font-weight="600">READY</text><text x="105.0" y="153" text-anchor="middle" font-size="13">模型加载完成</text><text x="105.0" y="177" text-anchor="middle" font-size="13">等待第一次Enter</text><path d="M180.0 142 H200.0" fill="none" stroke="#285c4a" stroke-width="2" marker-end="url(#a)"/><rect x="204.0" y="90" width="150" height="105" rx="5" fill="#eef1e7" stroke="#a8b79d"/><text x="279.0" y="123" text-anchor="middle" font-size="18" font-weight="600">HOMING</text><text x="279.0" y="153" text-anchor="middle" font-size="13">原3秒渐入</text><text x="279.0" y="177" text-anchor="middle" font-size="13">受限归位</text><path d="M354.0 142 H374.0" fill="none" stroke="#285c4a" stroke-width="2" marker-end="url(#a)"/><rect x="378.0" y="90" width="150" height="105" rx="5" fill="#eef1e7" stroke="#a8b79d"/><text x="453.0" y="123" text-anchor="middle" font-size="18" font-weight="600">AT_START</text><text x="453.0" y="153" text-anchor="middle" font-size="13">身体稳定到位</text><text x="453.0" y="177" text-anchor="middle" font-size="13">摆物后第二次Enter</text><path d="M528.0 142 H548.0" fill="none" stroke="#285c4a" stroke-width="2" marker-end="url(#a)"/><rect x="552.0" y="90" width="150" height="105" rx="5" fill="#eef1e7" stroke="#a8b79d"/><text x="627.0" y="123" text-anchor="middle" font-size="18" font-weight="600">CAMERA_WAIT</text><text x="627.0" y="153" text-anchor="middle" font-size="13">等待确认之后</text><text x="627.0" y="177" text-anchor="middle" font-size="13">的新相机帧</text><path d="M702.0 142 H722.0" fill="none" stroke="#285c4a" stroke-width="2" marker-end="url(#a)"/><rect x="726.0" y="90" width="150" height="105" rx="5" fill="#eef1e7" stroke="#a8b79d"/><text x="801.0" y="123" text-anchor="middle" font-size="18" font-weight="600">MODEL</text><text x="801.0" y="153" text-anchor="middle" font-size="13">生成与执行动作</text><text x="801.0" y="177" text-anchor="middle" font-size="13">仍保留控制保护</text><path d="M876.0 142 H896.0" fill="none" stroke="#285c4a" stroke-width="2" marker-end="url(#a)"/><rect x="900.0" y="90" width="150" height="105" rx="5" fill="#eef1e7" stroke="#a8b79d"/><text x="975.0" y="123" text-anchor="middle" font-size="18" font-weight="600">HOLD</text><text x="975.0" y="153" text-anchor="middle" font-size="13">Q、故障或超时</text><text x="975.0" y="177" text-anchor="middle" font-size="13">保持并准备下一轮</text><path d="M975.0 195 V233 H105.0 V198" fill="none" stroke="#285c4a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="540" y="273" text-anchor="middle" font-size="14">概念状态图：下一轮仍需本地确认与启动渐入；不代表避障规划、物理到位或任务成功检测。</text></g></svg>