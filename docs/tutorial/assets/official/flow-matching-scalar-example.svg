<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc"><title id="title">Flow Matching标量算例</title><desc id="desc">纯教学标量算例。目标动作2，噪声负1，训练t为0.6，混合值0.2，目标速度负3；推理假设理想速度恒为负3，dt负0.1，从负1经10步到2。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21624e"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#233830}.title{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:700}.t{font-size:19px}.s{font-size:16px;fill:#637469}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:19px}.line{fill:none;stroke:#21624e;stroke-width:2.4;marker-end:url(#arr)}.dashed{stroke-dasharray:7 7}</style><rect width="100%" height="100%" rx="20" fill="#fbf7ec"/><text x="38" y="52" class="title" text-anchor="start">Flow Matching：学的是“往哪里改”，推理才把噪声改成动作</text><text x="38" y="88" class="s" text-anchor="start">以下数字为可手算的教学例子，不是模型的真实输出。单位是标准化后的动作数值。</text><rect x="38" y="118" width="1204" height="211" rx="14" fill="#e7efe7" stroke="#a8b9ad"/><text x="62" y="158" class="h" text-anchor="start">训练：已知示范，构造一道有答案的题</text><text x="62" y="203" class="t" text-anchor="start">真实动作 A = 2；采样噪声 ε = −1；采样流时间 t = 0.6</text><text x="62" y="232" class="t" text-anchor="start">含噪输入 xₜ = tε + (1−t)A = 0.6×(−1) + 0.4×2 = 0.2</text><text x="62" y="261" class="t" text-anchor="start">速度标签 u = ε − A = −3；若网络预测 v = −2.7，则单元素平方误差 = 0.09</text><rect x="38" y="351" width="1204" height="237" rx="14" fill="#e7efe7" stroke="#a8b9ad"/><text x="62" y="392" class="h" text-anchor="start">推理：只有条件与噪声，没有真实示范动作</text><text x="62" y="429" class="t" text-anchor="start">假设已学到本例理想速度 v = −3；每轮 x ← x − 0.1×v，10 轮从 −1 到 2。</text><circle cx="132" cy="492" r="28" fill="#e7efe7" stroke="#21624e"/><text x="132" y="498" class="mono" text-anchor="middle">-1</text><text x="132" y="552" class="s" text-anchor="middle">t = 1.0</text><path class="line " d="M 164 492 H 297"/><circle cx="332" cy="492" r="28" fill="#e7efe7" stroke="#21624e"/><text x="332" y="498" class="mono" text-anchor="middle">-0.4</text><text x="332" y="552" class="s" text-anchor="middle">t = 0.8</text><path class="line " d="M 364 492 H 497"/><circle cx="532" cy="492" r="28" fill="#e7efe7" stroke="#21624e"/><text x="532" y="498" class="mono" text-anchor="middle">0.2</text><text x="532" y="552" class="s" text-anchor="middle">t = 0.6</text><path class="line " d="M 564 492 H 697"/><circle cx="732" cy="492" r="28" fill="#e7efe7" stroke="#21624e"/><text x="732" y="498" class="mono" text-anchor="middle">0.8</text><text x="732" y="552" class="s" text-anchor="middle">t = 0.4</text><path class="line " d="M 764 492 H 897"/><circle cx="932" cy="492" r="28" fill="#e7efe7" stroke="#21624e"/><text x="932" y="498" class="mono" text-anchor="middle">1.4</text><text x="932" y="552" class="s" text-anchor="middle">t = 0.2</text><path class="line " d="M 964 492 H 1097"/><circle cx="1132" cy="492" r="28" fill="#e9bd3e" stroke="#21624e"/><text x="1132" y="498" class="mono" text-anchor="middle">2</text><text x="1132" y="552" class="s" text-anchor="middle">t = 0.0</text><text x="38" y="624" class="s" text-anchor="start">本项目把同一道理同时用于 50×32 个数，再取前 6 维并反标准化。真实网络每一轮都会重算速度。</text></svg>