<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc"><title id="title">注意力数值教学算例</title><desc id="desc">查询向量为1和0，三条键对应得分2、1、0，经softmax变成0.665、0.245、0.09。三条值加权得到2.129和0.399。只是说明运算，不是模型学到的注意力。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21624e"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#233830}.title{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:700}.t{font-size:19px}.s{font-size:16px;fill:#637469}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:19px}.line{fill:none;stroke:#21624e;stroke-width:2.4;marker-end:url(#arr)}.dashed{stroke-dasharray:7 7}</style><rect width="100%" height="100%" rx="20" fill="#fbf7ec"/><text x="38" y="52" class="title" text-anchor="start">Attention：先算相关性，再有权重地取信息</text><text x="38" y="89" class="s" text-anchor="start">Q 是当前要查询的特征；K 是可比较的特征；V 是要搬运的信息。角色解释不等于人的意识。</text><rect x="38" y="129" width="285" height="173" rx="14" fill="#e7efe7" stroke="#a8b9ad"/><text x="60" y="166" class="h" text-anchor="start">一条 Query</text><text x="60" y="211" class="t" text-anchor="start">q = [1,0]</text><text x="60" y="240" class="t" text-anchor="start">dₖ = 2；除以 √2 缩放</text><rect x="367" y="129" width="425" height="173" rx="14" fill="#e7efe7" stroke="#a8b9ad"/><text x="390" y="166" class="h" text-anchor="start">三条 Key 与 Value</text><text x="390" y="207" class="t" text-anchor="start">K = [[2√2,0], [√2,0], [0,0]]</text><text x="390" y="236" class="t" text-anchor="start">V = [[2,0], [4,2], [−2,−1]]</text><text x="390" y="265" class="t" text-anchor="start">qKᵀ/√2 = [2,1,0]</text><path class="line " d="M 324 214 H 365"/><path class="line " d="M 794 214 H 834"/><rect x="837" y="129" width="405" height="173" rx="14" fill="#f5e5bc" stroke="#a8b9ad"/><text x="860" y="166" class="h" text-anchor="start">Softmax → 加权求和</text><text x="860" y="207" class="t" text-anchor="start">权重 ≈ [0.665,0.245,0.090]</text><text x="860" y="236" class="t" text-anchor="start">输出 ≈ [2.129,0.399]</text><text x="860" y="265" class="t" text-anchor="start">这是一条 token 的更新信息</text><rect x="38" y="343" width="1204" height="182" rx="14" fill="#e7efe7" stroke="#a8b9ad"/><text x="62" y="383" class="h" text-anchor="start">放回本项目：SA 与 CA 的区别在于信息来自哪里</text><text x="62" y="429" class="t" text-anchor="start">SA：动作位置之间通过因果 mask 交换信息，后面的动作可利用前面的动作特征。</text><text x="62" y="458" class="t" text-anchor="start">CA：动作特征作 Query，视觉／文本／状态的上下文特征提供 Key 和 Value。</text><text x="62" y="487" class="t" text-anchor="start">一个 Transformer block 还包括残差、归一化与 MLP；Attention 不是整个网络。</text><text x="38" y="574" class="s" text-anchor="start">示例权重与向量为人工构造；实际 SmolVLA 多头注意力与特征维度更大。</text></svg>