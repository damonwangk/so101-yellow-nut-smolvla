<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc"><title id="title">SmolVLA：从本项目输入到50步动作的可核对架构</title><desc id="desc">原创教学重绘。图像64个token、语言48个位置、状态1个token组成113位置的VLM前缀；前16层文字主干为动作专家提供条件。专家以50个含噪动作token并行预测速度，10轮Euler采样生成50乘6动作。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21624e"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#233830}.title{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:700}.t{font-size:19px}.s{font-size:16px;fill:#637469}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:19px}.line{fill:none;stroke:#21624e;stroke-width:2.4;marker-end:url(#arr)}.dashed{stroke-dasharray:7 7}</style><rect width="100%" height="100%" rx="20" fill="#fbf7ec"/><text x="40" y="52" class="title" text-anchor="start">SmolVLA：看懂条件，再生成连续动作</text><text x="40" y="83" class="s" text-anchor="start">据官方架构与 LeRobot v0.6.1 整理的原创教学图 · 数字取自本项目配置</text><rect x="35" y="112" width="410" height="390" rx="14" fill="#e7efe7" stroke="#a8b9ad"/><text x="58" y="147" class="h" text-anchor="start">① 三种输入，三条编码路径</text><rect x="58" y="170" width="364" height="87" rx="14" fill="#fbf7ec" stroke="#a8b9ad"/><text x="77" y="198" class="t" text-anchor="start">腕部 RGB  [B,3,512,512]</text><text x="77" y="227" class="t" text-anchor="start">SigLIP → connector → [B,64,960]</text><rect x="58" y="273" width="364" height="83" rx="14" fill="#fbf7ec" stroke="#a8b9ad"/><text x="77" y="301" class="t" text-anchor="start">任务文本 → tokenizer → embedding</text><text x="77" y="330" class="t" text-anchor="start">[B,48] → [B,48,960]</text><rect x="58" y="372" width="364" height="105" rx="14" fill="#fbf7ec" stroke="#a8b9ad"/><text x="77" y="400" class="t" text-anchor="start">当前关节实测值  [B,6]</text><text x="77" y="429" class="t" text-anchor="start">标准化 → 补零 [B,32]</text><text x="77" y="458" class="t" text-anchor="start">state_proj → [B,1,960]</text><rect x="495" y="112" width="400" height="390" rx="14" fill="#e7efe7" stroke="#a8b9ad"/><text x="518" y="147" class="h" text-anchor="start">② 视觉语言主干：提供条件</text><text x="518" y="187" class="t" text-anchor="start">拼接位置：64 + 48 + 1 = 113</text><text x="518" y="217" class="t" text-anchor="start">文本 padding 由 mask 排除</text><rect x="520" y="237" width="350" height="30" rx="6" fill="#21624e" stroke="#21624e"/><text x="695" y="259" text-anchor="middle" style="fill:white;font-size:17px">SmolLM2 文字层 1–4</text><rect x="520" y="275" width="350" height="30" rx="6" fill="#21624e" stroke="#21624e"/><text x="695" y="297" text-anchor="middle" style="fill:white;font-size:17px">SmolLM2 文字层 5–8</text><rect x="520" y="313" width="350" height="30" rx="6" fill="#21624e" stroke="#21624e"/><text x="695" y="335" text-anchor="middle" style="fill:white;font-size:17px">SmolLM2 文字层 9–12</text><rect x="520" y="351" width="350" height="30" rx="6" fill="#21624e" stroke="#21624e"/><text x="695" y="373" text-anchor="middle" style="fill:white;font-size:17px">SmolLM2 文字层 13–16</text><rect x="520" y="404" width="350" height="39" rx="14" fill="#fbf7ec" stroke="#a8b9ad"/><text x="695" y="430" class="s" text-anchor="middle">原层 17–32 被移除</text><text x="518" y="477" class="s" text-anchor="start">本项目冻结整个 VLM；状态投影可训练</text><path class="line " d="M 445 300 H 493"/><rect x="945" y="112" width="460" height="390" rx="14" fill="#f5e5bc" stroke="#a8b9ad"/><text x="970" y="147" class="h" text-anchor="start">③ 动作专家：连续向量场</text><text x="970" y="185" class="t" text-anchor="start">16 层，隐藏宽度 720</text><text x="970" y="214" class="t" text-anchor="start">SA / CA 交替；CA 读取 VLM 的 K/V</text><rect x="971" y="247" width="195" height="32" rx="6" fill="#e9bd3e" stroke="#74543b"/><text x="1068" y="270" class="s" text-anchor="middle">SA  第 1/3 层</text><rect x="1180" y="247" width="194" height="32" rx="6" fill="#fbf7ec" stroke="#74543b"/><text x="1277" y="270" class="s" text-anchor="middle">CA  第 2/4 层</text><rect x="971" y="289" width="195" height="32" rx="6" fill="#e9bd3e" stroke="#74543b"/><text x="1068" y="312" class="s" text-anchor="middle">SA  第 5/7 层</text><rect x="1180" y="289" width="194" height="32" rx="6" fill="#fbf7ec" stroke="#74543b"/><text x="1277" y="312" class="s" text-anchor="middle">CA  第 6/8 层</text><rect x="971" y="331" width="195" height="32" rx="6" fill="#e9bd3e" stroke="#74543b"/><text x="1068" y="354" class="s" text-anchor="middle">SA  第 9/11 层</text><rect x="1180" y="331" width="194" height="32" rx="6" fill="#fbf7ec" stroke="#74543b"/><text x="1277" y="354" class="s" text-anchor="middle">CA  第 10/12 层</text><rect x="971" y="373" width="195" height="32" rx="6" fill="#e9bd3e" stroke="#74543b"/><text x="1068" y="396" class="s" text-anchor="middle">SA  第 13/15 层</text><rect x="1180" y="373" width="194" height="32" rx="6" fill="#fbf7ec" stroke="#74543b"/><text x="1277" y="396" class="s" text-anchor="middle">CA  第 14/16 层</text><text x="970" y="448" class="t" text-anchor="start">50 个动作位置并行计算</text><text x="970" y="477" class="t" text-anchor="start">输出 vθ(xₜ,t,条件)  [B,50,32]</text><path class="line " d="M 895 300 H 943"/><rect x="35" y="545" width="410" height="217" rx="14" fill="#e7efe7" stroke="#a8b9ad"/><text x="58" y="580" class="h" text-anchor="start">④ 动作与流时间的入口</text><text x="58" y="620" class="t" text-anchor="start">噪声 / 含噪动作 xₜ  [B,50,32]</text><text x="58" y="649" class="t" text-anchor="start">action_in_proj：32 → 720</text><text x="58" y="678" class="t" text-anchor="start">t → 正弦余弦编码 720 维</text><text x="58" y="707" class="t" text-anchor="start">拼接后 MLP：1440 → 720 → 720</text><rect x="495" y="545" width="400" height="217" rx="14" fill="#f5e5bc" stroke="#a8b9ad"/><text x="518" y="580" class="h" text-anchor="start">⑤ 采样：一块动作打磨 10 轮</text><text x="518" y="620" class="t" text-anchor="start">x₁ = 高斯噪声；dt = −0.1</text><text x="518" y="649" class="t" text-anchor="start">每轮：x ← x + dt × vθ</text><text x="518" y="678" class="t" text-anchor="start">流时间 t：1 → 0</text><text x="518" y="707" class="t" text-anchor="start">这 10 轮不等于 10 次电机命令</text><path class="line " d="M 240 545 V 520 H 925 V 348 H 943"/><path class="line " d="M 1175 504 V 523 H 695 V 543"/><rect x="945" y="545" width="460" height="217" rx="14" fill="#e7efe7" stroke="#a8b9ad"/><text x="970" y="580" class="h" text-anchor="start">⑥ 返回物理动作，再交给执行器</text><text x="970" y="620" class="t" text-anchor="start">[B,50,32] → 去掉后 26 维</text><text x="970" y="649" class="t" text-anchor="start">反标准化 → [B,50,6]</text><text x="970" y="678" class="t" text-anchor="start">5 个关节角度 + 1 个夹爪位置</text><text x="970" y="707" class="t" text-anchor="start">执行器另管队列、限速、工作边界</text><path class="line " d="M 895 650 H 943"/><path class="line dashed" d="M 695 762 V 786 H 240 V 764"/><text x="380" y="781" class="s">更新x与t，再进入专家（共10轮）</text><text x="42" y="812" class="t" text-anchor="start">B = 训练批量 8；真机推理通常为 1。状态是实测值，动作是控制目标，两者含义不同。</text><text x="42" y="850" class="s" text-anchor="start">本图不表示真实注意力热力图，也不表示障碍物感知或夹持力控制。模型与执行器的职责须分别核查。</text><text x="42" y="885" class="s" text-anchor="start">来源：huggingface.co/blog/smolvla · LeRobot v0.6.1 smolvla 源码；原创图示 Apache-2.0</text></svg>